server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: bilinmeyen yollar index.html'e düşsün, client-side router devralsın
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API isteklerini backend container'ına yönlendir (Docker Compose servis adı üzerinden)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend canlılık ucu (Docker healthcheck / CI smoke testi edge proxy üzerinden de kontrol edebilsin)
    location /health {
        proxy_pass http://backend:8080/health;
    }

    # Yüklenen dosyalar (attachment) da backend üzerinden servis ediliyor
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
