<div class="task-card-row">
  <div class="task-card-info">
    <span class="task-card-title">{{ task.title }}</span>
    <span class="task-card-meta">
      <ng-container *ngIf="task.category">
        <span class="color-dot" [style.backgroundColor]="task.category.color"></span>
        {{ task.category.name }} ·
      </ng-container>
      <span class="priority-badge" [ngClass]="'priority-' + task.priority">{{ getPriorityLabel(task.priority) }}</span>
    </span>

    <div class="task-card-progress" *ngIf="subtaskProgress as progress">
      <mat-progress-bar mode="determinate" [value]="progress.percent"></mat-progress-bar>
      <span class="task-card-progress-text">{{ progress.completed }}/{{ progress.total }}</span>
    </div>
  </div>

  <span *ngIf="badgeText" class="task-card-badge" [class.danger]="badgeVariant === 'danger'">
    {{ badgeText }}
  </span>
</div>
